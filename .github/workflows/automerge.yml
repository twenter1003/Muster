name: 자동 머지

# CI가 초록이면 PR을 머지한다. 사람이 "통과했나" 보고 버튼을 누르는 일을 없앤다.
#
# **드래프트가 손잡이다.** 드래프트인 동안은 절대 머지하지 않는다. 다 됐다고 판단해
# ready로 올리는 순간부터 CI가 통과하면 들어간다 — 별도 라벨을 외울 필요가 없고,
# "아직 보지 마라"를 표시하는 자리가 이미 GitHub에 있다.
#
# 트리거가 둘인 이유는 순서가 둘이기 때문이다:
#   ready로 올려 둔 PR에 CI가 끝나는 경우   → workflow_run
#   CI가 이미 끝난 PR을 ready로 올리는 경우 → pull_request(ready_for_review)
# 처음에는 workflow_run만 걸었는데, 두 번째 순서에서는 새로 도는 CI가 없어 트리거가 영영
# 걸리지 않았다(#24가 그렇게 손 머지로 들어갔다). 확인하고 나서 ready로 올리는 쪽이 오히려
# 흔한 흐름이다.
#
# workflow_run은 기본 브랜치의 정의로 돈다 — **이 파일은 main에 들어간 뒤부터 동작한다.**
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [ready_for_review]

# 같은 커밋에 두 트리거가 겹쳐 들어올 수 있다(ready 직후 CI 완료). 커밋 단위로 묶어
# 한 번만 돌게 한다. 머지 도중에 취소하지는 않는다.
concurrency:
  group: >-
    automerge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: CI 초록이면 머지
    # 실패한 CI와 PR이 아닌 실행(main 푸시 등)은 여기서 걸러진다.
    # ready_for_review로 들어온 경우는 CI 상태를 아래 스텝이 직접 조회한다.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 머지 대상인지 확인
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 트리거에 따라 한쪽만 채워진다.
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 머지하지 않고 끝내는 모든 길이 여기를 지난다. 이유를 반드시 남긴다 —
          # 아무 말 없이 안 들어간 PR은 사람이 한참 뒤에 발견한다.
          skip() { echo "$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # 1. 대상 PR 번호. workflow_run은 커밋으로 거슬러 올라가고, ready는 그대로 온다.
          if [ -n "${PR_NUMBER:-}" ]; then
            number="$PR_NUMBER"
          else
            number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RUN_SHA}/pulls" \
              --jq '[.[] | select(.state == "open")] | first | .number // empty')"
          fi

          [ -n "$number" ] || skip "이 커밋에 열린 PR이 없다."

          # 2. PR 자체가 대상인지. 조건은 PR에서 직접 읽는다 — 이벤트 페이로드는 낡을 수 있고
          #    (ready로 올린 뒤 다시 드래프트로 내리는 경우), 두 트리거의 모양도 다르다.
          #      draft            아직 보지 말라는 뜻이다.
          #      head.repo        포크 PR은 남의 코드다. 검토 없이 들이지 않는다.
          #      base.ref=main    릴리스 브랜치 같은 다른 대상은 사람이 판단한다.
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          head="$(jq -r '.head.sha' <<<"$pr")"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] \
             || [ "$base" != "main" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            skip "PR #${number}은(는) 자동 머지 대상이 아니다 (state=$state draft=$draft base=$base repo=$head_repo)."
          fi

          # 3. CI가 통과한 커밋이 지금도 head인지. workflow_run으로 들어온 경우에만 의미가
          #    있다 — 그 사이 새 커밋이 올라왔다면 초록은 낡은 커밋의 것이다.
          if [ -n "${RUN_SHA:-}" ] && [ "$head" != "$RUN_SHA" ]; then
            skip "PR #${number}의 head가 ${head}로 바뀌었다. 그 커밋의 CI가 끝나면 다시 걸린다."
          fi

          # 4. 지금 head에 달린 검사가 전부 끝났고 전부 성공인지 확인한다.
          #    ready로 들어온 경로에는 이 조회가 유일한 CI 판단 근거다. workflow_run 경로에도
          #    같은 검사를 거는 이유는, 그 사이 다른 검사가 추가되거나 재실행될 수 있어서다.
          #
          #    **자기 자신은 뺀다.** pull_request로 트리거되면 이 워크플로도 PR head의 체크 런이
          #    되는데, 그 체크는 지금 이 스크립트가 도는 동안 당연히 in_progress다. 빼지 않으면
          #    "아직 도는 검사가 있다"며 스스로를 영원히 막는다(#26에서 실제로 그랬다).
          #    이름이 아니라 실행 id로 가른다 — 잡 이름은 바뀔 수 있고, 바뀌는 순간 조용히
          #    교착으로 돌아간다.
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs" --paginate \
            | jq -s --arg mine "/actions/runs/${GITHUB_RUN_ID}/" \
                '[.[].check_runs[]] | map(select((.details_url // "") | contains($mine) | not))')"
          total="$(jq -r 'length' <<<"$checks")"
          pending="$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$checks")"
          bad="$(jq -r '[.[] | select(.status == "completed" and
                          (.conclusion | IN("success", "neutral", "skipped") | not))] | length' <<<"$checks")"

          [ "$total" != "0" ] || skip "PR #${number}의 head에 검사가 하나도 없다. 머지하지 않는다."
          [ "$pending" = "0" ] || skip "아직 도는 검사가 ${pending}개 있다. 끝나면 workflow_run으로 다시 걸린다."
          [ "$bad" = "0" ] || skip "실패한 검사가 ${bad}개 있다. 머지하지 않는다."

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: 머지
        if: steps.target.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.target.outputs.number }}
        # 이 저장소의 관행대로 머지 커밋으로 넣는다(스쿼시·리베이스 아님).
        # 머지할 수 없는 상태(충돌 등)면 gh가 실패하고, 그 실패가 이 워크플로에 남는다 —
        # 조용히 넘어가면 "왜 안 들어갔지"를 사람이 나중에 발견하게 된다.
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --merge
