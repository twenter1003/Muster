name: muster

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muster -d muster']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://muster:muster@db:5432/muster
    ports:
      - '8080:8080'
    volumes:
      # 소스만 마운트하고 node_modules는 컨테이너 것을 쓴다 (호스트/컨테이너 바이너리 충돌 방지).
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/test:/app/apps/api/test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
